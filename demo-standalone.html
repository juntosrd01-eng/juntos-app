<!DOCTYPE html><html lang="es-DO"><head><meta charset="utf-8"><title>JUNTOS · Acompáñame RD</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--b:#0A4DA1;--y:#FFC20E;--bg:#fff;--tx:#14213d;--cd:#f3f7fd;--mu:#5b6b85;--ln:#dfe6f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1526;--tx:#eef3fb;--cd:#16213a;--mu:#9fb0cc;--ln:#26355a}}
:root[data-theme="dark"]{--bg:#0d1526;--tx:#eef3fb;--cd:#16213a;--mu:#9fb0cc;--ln:#26355a}
*{box-sizing:border-box}html,body{margin:0;font-family:Poppins,Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:520px;margin:0 auto;padding:0 16px 96px;min-height:100vh}
h1{font-size:30px;line-height:1.15;margin:0 0 10px}h2{font-size:20px;margin:18px 0 8px}h3{font-size:16px;margin:0}p{margin:6px 0;line-height:1.5}
.mu{color:var(--mu);font-size:13px}.card{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:14px;margin:10px 0}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font:600 16px Poppins,sans-serif;background:var(--b);color:#fff;cursor:pointer;margin:8px 0}
.btn.y{background:var(--y);color:#1a1a1a}.btn.g{background:transparent;color:var(--b);border:2px solid var(--b)}.btn.r{background:#d62839}.btn:disabled{opacity:.45}
.btn.s{display:inline-block;width:auto;padding:8px 14px;font-size:13px;margin:4px 4px 0 0}
input,select,textarea{width:100%;padding:12px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg);color:var(--tx);font:16px Poppins,sans-serif;margin:4px 0 10px}
label{font-size:13px;font-weight:600}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--ln)}
.Pendiente{background:#ffe3a3;color:#5c4200}.Pagado{background:#cfe6ff;color:#073a7a}.Asignado{background:#d5f5dc;color:#11552a}.Curso{background:var(--y);color:#111}.Completado{background:#ddd;color:#333}
.opt{display:flex;gap:10px;align-items:center;padding:12px;border:2px solid var(--ln);border-radius:16px;margin:6px 0;cursor:pointer;background:var(--bg)}.opt.on{border-color:var(--b);background:var(--cd)}.opt b{margin-left:auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:10px 0;border-bottom:1px solid var(--ln);margin-bottom:8px}
.logo{font-weight:700;color:var(--b);font-size:20px}.logo i{font-style:normal;color:var(--y);background:var(--b);border-radius:8px;padding:0 6px;margin-right:6px}
.seg{display:flex;gap:6px;overflow-x:auto;margin-top:8px}.seg button{flex:none;border:1.5px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:99px;padding:6px 12px;font:600 12px Poppins}.seg .on{background:var(--b);color:#fff;border-color:var(--b)}
.hero{background:linear-gradient(160deg,var(--b),#062f66);color:#fff;border-radius:28px;padding:24px;margin:8px 0}.hero h1{color:#fff}.hero em{font-style:normal;color:var(--y)}
.tl{border-left:3px solid var(--y);margin:8px 0 8px 8px;padding-left:14px}.tl>div{margin-bottom:14px}.tl img{width:100%;border-radius:14px;margin-top:6px}
.stars button{background:none;border:0;font-size:30px;cursor:pointer;color:#c9c9c9}.stars .on{color:var(--y)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--ln);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
.nav div{display:flex;max-width:520px;width:100%;gap:6px}.nav button{flex:1;border:0;background:none;color:var(--mu);font:600 12px Poppins;padding:6px}.nav .on{color:var(--b)}.nav span{display:block;font-size:22px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;display:flex;align-items:flex-end;justify-content:center}.sheet>div{background:var(--bg);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#111;color:#fff;padding:10px 16px;border-radius:14px;z-index:20;font-size:14px;max-width:90%}
.sos{position:fixed;right:14px;bottom:82px;width:64px;height:64px;border-radius:50%;background:#d62839;color:#fff;border:4px solid #fff;font:700 15px Poppins;z-index:7;box-shadow:0 4px 14px rgba(0,0,0,.35)}
svg{width:100%;height:auto;border-radius:16px;display:block}.vid{background:#0A4DA1;color:#fff;border-radius:14px;padding:22px;text-align:center;margin-top:6px}
@media(prefers-reduced-motion:no-preference){.btn{transition:transform .1s}.btn:active{transform:scale(.97)}}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
</style></head><body><div id="app"></div><div id="ov"></div>
<script>
const T={4:{n:'4 horas',p:2200},8:{n:'8 horas',p:4000},12:{n:'Noche Respiro 12h',p:3500}},AD={video:{n:'Video-Abrazo',p:300,i:'🎥'},med:{n:'Chequeo de medicación',p:250,i:'💊'}};
const PROV='Azua,Bahoruco,Barahona,Dajabón,Distrito Nacional,Duarte,El Seibo,Elías Piña,Espaillat,Hato Mayor,Hermanas Mirabal,Independencia,La Altagracia,La Romana,La Vega,María Trinidad Sánchez,Monseñor Nouel,Monte Cristi,Monte Plata,Pedernales,Peravia,Puerto Plata,Samaná,San Cristóbal,San José de Ocoa,San Juan,San Pedro de Macorís,Sánchez Ramírez,Santiago,Santiago Rodríguez,Santo Domingo,Valverde'.split(',');
const PC={'Santiago':[19.45,-70.69],'Distrito Nacional':[18.47,-69.93],'Santo Domingo':[18.5,-69.85],'La Vega':[19.22,-70.53],'Puerto Plata':[19.79,-70.69],'San Cristóbal':[18.42,-70.1]};
const NM='María,Altagracia,Yolanda,Carmen,Josefina,Ramona,Milagros,Mercedes,Esperanza,Dulce'.split(','),AP='Pérez,Rodríguez,Santana,Núñez,Peña,Reyes'.split(',');
const ACO=Array.from({length:30},(_,i)=>({id:i+1,n:i?NM[i%10]+' '+AP[i%6]:'María Altagracia Pérez',r:(4.6+((i*7)%5)/12).toFixed(1),v:i!==29}));
const today=new Date().toISOString().slice(0,10),now=Date.now();
let S={role:'landing',tab:'ini',sel:null,d:{tipo:8,add:[],fecha:today,hora:'09:00',prov:'Santiago',dir:'',notas:'',abuelo:''},sos:0,sheet:'',toast:'',sim:{}};
let V=[
{id:1,fam:'Carmen Núñez (NY)',ab:'Don Pedro',tipo:4,fecha:today,hora:'09:00',prov:'Santiago',dir:'C/ del Sol #45, Los Jardines',notas:'Movilidad reducida, usa bastón.',lat:19.4517,lng:-70.697,add:['video','med'],estado:'Asignado',aco:1,ci:[],rep:null,rt:0},
{id:2,fam:'Luis Reyes (Madrid)',ab:'Doña Rosa',tipo:12,fecha:today,hora:'20:00',prov:'Distrito Nacional',dir:'Av. Independencia #310, Gazcue',notas:'Alzheimer inicial. No dejar sola con la estufa.',lat:18.462,lng:-69.905,add:['med'],estado:'Pagado',aco:0,ci:[],rep:null,rt:0},
{id:3,fam:'Carmen Núñez (NY)',ab:'Don Pedro',tipo:4,fecha:new Date(now-864e5).toISOString().slice(0,10),hora:'09:00',prov:'Santiago',dir:'C/ del Sol #45, Los Jardines',notas:'',lat:19.4517,lng:-70.697,add:['video'],estado:'Completado',aco:1,ci:[],rep:{comio:'Comió bien',pastilla:true,animo:5,nota:'Rezamos juntos y vimos la novela.',demo:1},rt:5}];
const $=s=>document.querySelector(s),R=n=>'RD$'+n.toLocaleString('es-DO'),U=n=>'US$'+(n/60).toFixed(2);
const tm=d=>new Date(d).toLocaleTimeString('es-DO',{hour:'numeric',minute:'2-digit'}),dt=d=>new Date(d).toLocaleDateString('es-DO',{day:'numeric',month:'short'});
const base=s=>T[s.tipo].p,tot=(t,a)=>T[t].p+a.reduce((x,k)=>x+AD[k].p,0),tot2=s=>tot(s.tipo,s.add);
function mark(file,tx){return new Promise(res=>{const c=document.createElement('canvas'),x=c.getContext('2d');const go=im=>{const w=640,h=im?Math.round(im.height*w/im.width):480;c.width=w;c.height=h;if(im)x.drawImage(im,0,0,w,h);else{const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#0A4DA1');g.addColorStop(1,'#FFC20E');x.fillStyle=g;x.fillRect(0,0,w,h);x.font='110px serif';x.textAlign='center';x.fillText('👵🏽🤝',w/2,h/2);x.textAlign='left'}x.fillStyle='rgba(0,0,0,.62)';x.fillRect(0,h-66,w,66);x.fillStyle='#fff';x.font='bold 16px sans-serif';tx.forEach((t,i)=>x.fillText(t,12,h-45+i*20));x.fillStyle='#FFC20E';x.fillText('JUNTOS',w-84,h-45);res(c.toDataURL('image/jpeg',.72))};if(!file)return go();const im=new Image();im.onload=()=>go(im);im.onerror=()=>go();im.src=URL.createObjectURL(file)})}
const gps=s=>new Promise(r=>{const f=()=>r({lat:s.lat+(Math.random()-.5)*.0008,lng:s.lng+(Math.random()-.5)*.0008,sim:1});if(!navigator.geolocation)return f();navigator.geolocation.getCurrentPosition(p=>r({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)}),f,{enableHighAccuracy:true,timeout:7000,maximumAge:0})});
function map(pts){const X=g=>((g+72)/3.75*300).toFixed(1),Y=t=>((20-t)/2.6*170).toFixed(1);const poly='-71.65,19.88 -70.5,19.85 -69.3,19.25 -68.4,18.85 -68.35,18.55 -68.8,18.2 -70,18.4 -71.1,17.85 -71.7,17.75 -71.75,18.9'.split(' ').map(p=>{const[a,b]=p.split(',');return X(+a)+','+Y(+b)}).join(' ');
return `<svg viewBox="0 0 300 170"><rect width="300" height="170" fill="#cfe6ff"/><polygon points="${poly}" fill="#f4ecd0" stroke="#0A4DA1" stroke-width="1.5"/>${pts.map(p=>`<circle cx="${X(p.lng)}" cy="${Y(p.lat)}" r="${p.big?7:5}" fill="${p.c}" stroke="#fff" stroke-width="2"/><text x="${+X(p.lng)+8}" y="${+Y(p.lat)+4}" font-size="9" font-weight="700" fill="#0A4DA1">${p.l}</text>`).join('')}</svg>`}
function toast(t){S.toast=t;R_();setTimeout(()=>{S.toast='';R_()},3200)}
const st=s=>s.estado==='En curso'?'Curso':s.estado;
async function init(){const s=V[2],d=new Date(s.fecha+'T09:02'),e=new Date(s.fecha+'T13:05');s.ci=[{t:'in',ts:+d,lat:s.lat,lng:s.lng,foto:await mark(0,['María llegó · '+tm(d),dt(d)+' · '+s.lat.toFixed(4)+', '+s.lng.toFixed(4)])},{t:'out',ts:+e,lat:s.lat,lng:s.lng,foto:await mark(0,['Check-out · '+tm(e),dt(e)+' · GPS verificado'])}];R_()}
function go(r,t){S.role=r;S.tab=t||'ini';S.sel=null;scrollTo(0,0);R_()}
function R_(){const r=S.role,a=$('#app');let h='';
if(r==='landing')h=landing();else if(r==='login')h=login();else{h=`<div class="top"><div class="row"><span class="logo"><i>J</i>JUNTOS</span><button class="btn s g" onclick="go('landing')">Salir</button></div><div class="seg">${[['familia','👨‍👩‍👧 Familia RD'],['diaspora','✈️ Diáspora'],['aco','💙 Acompañante'],['admin','🗺️ Mesa Op.']].map(x=>`<button class="${r==x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="mu" style="margin-top:4px">Modo demo: cambia de rol para ver cada pantalla</div></div>`+(r=='aco'?aco():r=='admin'?admin():fam())}
a.innerHTML=h;$('#ov').innerHTML=(S.sheet?`<div class="sheet" onclick="if(event.target==this){S.sheet='';R_()}"><div>${S.sheet}</div></div>`:'')+(S.toast?`<div class="toast">${S.toast}</div>`:'')+((r=='aco')?`<button class="sos" onclick="sos()">SOS</button>`:'')}
function landing(){return `<div class="top"><span class="logo"><i>J</i>JUNTOS</span></div><div class="hero"><h1>¿Tu papá está solo y tú en <em>Nueva York</em>?</h1><p>Acompañantes dominicanas verificadas, con chaleco azul, que te muestran con foto y hora que llegaron. Compañía humana, no clínica.</p><button class="btn y" onclick="go('login')">Solicitar acompañamiento</button><p class="mu" style="color:#cfe0ff">JUNTOS · A tu lado en cada paso</p></div>
<h2>Por qué familias confían en JUNTOS</h2>${[['🪪','Verificadas de verdad','Cédula, antecedentes y entrevista. Solo mujeres de 35 a 60 años.'],['📍','Llegada comprobada','Check-in con GPS y foto con hora y lugar. Sin tracking invasivo.'],['💬','Reporte en tu WhatsApp','Supiste si comió, si tomó su pastilla y cómo estaba de ánimo.'],['🤗','Video-Abrazo','Un video de 30 segundos de tu mayor, para ti.']].map(x=>`<div class="card row" style="justify-content:flex-start;gap:14px"><span style="font-size:30px">${x[0]}</span><div><h3>${x[1]}</h3><p class="mu">${x[2]}</p></div></div>`).join('')}
<h2>Precios claros</h2>${Object.keys(T).map(k=>`<div class="opt"><span>${T[k].n}</span><b>${R(T[k].p)}</b></div>`).join('')}<button class="btn" onclick="go('login')">Solicitar acompañamiento</button>
<div class="card"><h3>Próximamente</h3><p class="mu">💳 <b>JUNTOS Wallet</b>: recarga US$50/100/200 y paga servicios, farmacia y colmado.<br>🎓 <b>JUNTOS Academia</b>: curso de 40h, RD$8,500, chaleco y Sello JUNTOS.</p></div>`}
function login(){const p=S.otp;return `<div class="top"><span class="logo"><i>J</i>JUNTOS</span></div><h1>Entra con tu WhatsApp</h1><p class="mu">Sin correo ni contraseñas. Te mandamos un código.</p>${p?`<label>Código de 6 dígitos</label><input id="cd" inputmode="numeric" maxlength="6" placeholder="123456"><p class="mu">Demo: usa 123456</p><button class="btn" onclick="if($('#cd').value=='123456'){S.otp=0;go('familia')}else toast('Código incorrecto. Revisa tu WhatsApp e inténtalo otra vez.')">Verificar y entrar</button>`:`<label>Número de WhatsApp</label><input id="ph" type="tel" inputmode="tel" value="+1 809 555 0101"><button class="btn" onclick="S.otp=1;R_();toast('📲 Código enviado por WhatsApp (demo)')">Enviarme el código</button>`}`}
const nav=(a)=>`<div class="nav"><div>${a.map(x=>`<button class="${S.tab==x[0]&&!S.sel?'on':''}" onclick="S.tab='${x[0]}';S.sel=null;R_()"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div></div>`;
function fam(){const dia=S.role=='diaspora';let h='';
if(S.tab=='sol')h=solic(dia);else if(S.sel)h=detail(V.find(v=>v.id==S.sel),dia);else{h=`<h2>${dia?'Hola Carmen 👋':'Hola, familia'}</h2>`+(V.filter(v=>v.fam.startsWith(dia?'Carmen':'Luis')||!dia&&v.id!=1&&v.id!=3).length||1?'':'');
const L=V.filter(v=>dia?v.fam.startsWith('Carmen'):v.id>=2&&v.fam.startsWith('Luis')||v.id>3);
h+=(L.length?L:V).map(v=>`<div class="card" onclick="S.sel=${v.id};R_()" style="cursor:pointer"><div class="row"><h3>${v.ab}</h3><span class="chip ${st(v)}">${v.estado}</span></div><p class="mu">${T[v.tipo].n} · ${dt(v.fecha)} ${v.hora} · ${v.prov}</p><div class="row"><b>${dia?U(tot2(v)):R(tot2(v))}</b><span class="mu">Ver detalle ›</span></div></div>`).join('')}
return `<div>${h}</div>`+nav([['ini','🏠','Servicios'],['sol','➕','Solicitar']])}
function solic(dia){const d=S.d,total=tot(d.tipo,d.add);return `<h2>Solicitar acompañamiento</h2><label>¿Quién será acompañado?</label><input id="ab" value="${d.abuelo}" placeholder="Ej: Don Pedro" oninput="S.d.abuelo=this.value">
<label>Tipo de servicio</label>${Object.keys(T).map(k=>`<div class="opt ${d.tipo==k?'on':''}" onclick="S.d.tipo=${k};R_()"><span>${T[k].n}</span><b>${R(T[k].p)}</b></div>`).join('')}
<div class="row"><div style="flex:1"><label>Fecha</label><input type="date" value="${d.fecha}" min="${today}" onchange="S.d.fecha=this.value"></div><div style="flex:1"><label>Hora</label><input type="time" value="${d.hora}" onchange="S.d.hora=this.value"></div></div>
<label>Provincia</label><select onchange="S.d.prov=this.value">${PROV.map(p=>`<option ${p==d.prov?'selected':''}>${p}</option>`).join('')}</select>
<label>Dirección</label><input value="${d.dir}" placeholder="Calle, número, sector" oninput="S.d.dir=this.value"><a class="mu" target="_blank" rel="noopener" href="https://www.google.com/maps/search/${encodeURIComponent((d.dir||'')+' '+d.prov+' República Dominicana')}">📍 Verificar en Google Maps</a>
<label style="display:block;margin-top:10px">Notas (Alzheimer, movilidad, cuidados)</label><textarea rows="3" oninput="S.d.notas=this.value">${d.notas}</textarea>
<label>Add-ons</label>${Object.keys(AD).map(k=>`<div class="opt ${d.add.includes(k)?'on':''}" onclick="S.d.add=S.d.add.includes('${k}')?S.d.add.filter(x=>x!='${k}'):[...S.d.add,'${k}'];R_()"><span>${AD[k].i} ${AD[k].n}</span><b>+${R(AD[k].p)}</b></div>`).join('')}
<div class="card"><div class="row"><span>Base</span><span>${R(T[d.tipo].p)}</span></div>${d.add.map(k=>`<div class="row"><span>${AD[k].n}</span><span>${R(AD[k].p)}</span></div>`).join('')}<hr style="border:0;border-top:1px solid var(--ln)"><div class="row"><h3>Total</h3><h3>${R(total)}${dia?' · '+U(total):''}</h3></div></div>
<button class="btn y" onclick="crear()">Confirmar y pagar</button>`+nav([['ini','🏠','Servicios'],['sol','➕','Solicitar']])}
function crear(){const d=S.d;if(!d.dir||!d.abuelo)return toast('Faltan el nombre y la dirección.');const c=PC[d.prov]||[18.9,-70.4],v={id:V.length+1,fam:S.role=='diaspora'?'Carmen Núñez (NY)':'Familia RD',ab:d.abuelo,tipo:d.tipo,fecha:d.fecha,hora:d.hora,prov:d.prov,dir:d.dir,notas:d.notas,lat:c[0]+Math.random()*.03,lng:c[1]+Math.random()*.03,add:[...d.add],estado:'Pendiente',aco:0,ci:[],rep:null,rt:0};V.unshift(v);S.d={tipo:8,add:[],fecha:today,hora:'09:00',prov:'Santiago',dir:'',notas:'',abuelo:''};S.tab='ini';S.sel=v.id;pagar(v.id)}
function pagar(id){const v=V.find(x=>x.id==id),dia=S.role=='diaspora';S.sheet=`<h2>Pago · ${R(tot2(v))}</h2><div class="opt ${dia?'':'on'}" onclick="cobrar(${id},'Azul')">🇩🇴 <span>Azul Dominicana (tarjeta local)</span><b>${R(tot2(v))}</b></div><div class="opt ${dia?'on':''}" onclick="cobrar(${id},'Stripe')">💳 <span>Stripe (desde USA/España)</span><b>${U(tot2(v))}</b></div><p class="mu">Demo: al tocar se simula el pago. En producción abre el link de Azul o Stripe Checkout.</p>`;R_()}
function cobrar(id,m){const v=V.find(x=>x.id==id);v.estado='Pagado';v.pago=m;S.sheet='';S.sel=id;R_();toast('✅ Pago recibido por '+m+'. Notificación por WhatsApp enviada (demo).')}
function evs(v){const e=[];v.ci.forEach(c=>e.push(c.t=='in'?{ts:c.ts,t:`<b>${ACO[v.aco-1].n.split(' ')[0]} llegó ${tm(c.ts)}</b>`,f:c.foto,c}:{ts:c.ts,t:`<b>Check-out ${tm(c.ts)}</b>${v.rep?`<br>${v.ab}: ${v.rep.comio.toLowerCase()}, ${v.rep.pastilla?'tomó su pastilla':'sin pastilla hoy'}. Ánimo ${v.rep.animo}/5.${v.rep.nota?'<br><i>“'+v.rep.nota+'”</i>':''}`:''}`,f:c.foto,c}));return e}
function detail(v,dia){const e=evs(v),pts=[{lat:v.lat,lng:v.lng,c:'#0A4DA1',l:v.ab,big:1},...v.ci.map(c=>({lat:c.lat,lng:c.lng,c:c.t=='in'?'#FFC20E':'#2aa84a',l:c.t=='in'?'IN':'OUT'}))];
return `<button class="btn s g" onclick="S.sel=null;R_()">‹ Volver</button><div class="row"><h2>${v.ab}</h2><span class="chip ${st(v)}">${v.estado}</span></div><p class="mu">${T[v.tipo].n} · ${dt(v.fecha)} ${v.hora} · ${v.dir}, ${v.prov}</p>
${v.aco?`<div class="card">💙 <b>${ACO[v.aco-1].n}</b> · ⭐ ${ACO[v.aco-1].r} · Verificada con cédula y antecedentes · Chaleco azul</div>`:''}
${v.estado=='Pendiente'?`<button class="btn y" onclick="pagar(${v.id})">Pagar ${R(tot2(v))}</button>`:''}
<h2>Timeline</h2><div class="tl">${e.length?e.map(x=>`<div><span class="mu">${dt(x.ts)}</span><br>${x.t}${x.f?`<img src="${x.f}" alt="Foto con marca de agua">`:''}<p class="mu">📍 ${x.c.lat.toFixed(4)}, ${x.c.lng.toFixed(4)}${x.c.sim?' (GPS simulado)':''}</p></div>`).join(''):`<div><b>${v.estado=='Asignado'?'Acompañante asignada. Esperando check-in.':'Aún sin novedades.'}</b></div>`}</div>
${v.add.includes('video')&&v.rep?`<h2>🎥 Video-Abrazo</h2>${v.rep.video?`<video controls playsinline style="width:100%;border-radius:14px" src="${v.rep.video}"></video>`:`<div class="vid">▶️ “Hola mija, estoy bien”<br><span class="mu" style="color:#cfe0ff">Video de 30s (demo)</span></div>`}`:''}
${e.length?`<h2>Ubicación (solo check-in/out)</h2>${map(pts)}`:''}
${v.estado=='Completado'?`<h2>Califica a la acompañante</h2><div class="stars">${[1,2,3,4,5].map(i=>`<button class="${i<=v.rt?'on':''}" onclick="V.find(x=>x.id==${v.id}).rt=${i};R_();toast('Gracias por calificar ⭐')">★</button>`).join('')}</div><button class="btn g" onclick="fact(${v.id})">🧾 Ver factura (PDF)</button><button class="btn y" onclick="resch(${v.id})">🔁 Re-agendar</button>`:''}`}
function resch(id){const v=V.find(x=>x.id==id);S.d={...S.d,tipo:v.tipo,add:[...v.add],prov:v.prov,dir:v.dir,abuelo:v.ab,notas:v.notas};S.sel=null;S.tab='sol';R_()}
function fact(id){const v=V.find(x=>x.id==id);S.sheet=`<div id="inv"><h2>Factura JUNTOS #${1000+v.id}</h2><p class="mu">${dt(v.fecha)} · ${v.ab} · ${v.prov}</p><div class="row"><span>${T[v.tipo].n}</span><span>${R(T[v.tipo].p)}</span></div>${v.add.map(k=>`<div class="row"><span>${AD[k].n}</span><span>${R(AD[k].p)}</span></div>`).join('')}<hr><div class="row"><b>Total</b><b>${R(tot2(v))}</b></div></div><button class="btn" onclick="print()">Guardar como PDF / Imprimir</button>`;R_()}
function aco(){const m=V.filter(v=>v.aco==1&&v.estado!='Completado'),v=S.sel&&V.find(x=>x.id==S.sel);
if(v)return work(v);
return `<h2>Buenos días, María 👋</h2><div class="card">🪪 Verificada · Chaleco azul · ⭐ 4.9</div><h3>Mis servicios de hoy</h3>${m.length?m.map(x=>`<div class="card" onclick="S.sel=${x.id};R_()" style="cursor:pointer"><div class="row"><h3>${x.ab}</h3><span class="chip ${st(x)}">${x.estado}</span></div><p class="mu">${T[x.tipo].n} · ${x.hora}<br>${x.dir}</p><p class="mu">📝 ${x.notas||'Sin notas'}</p><button class="btn">Abrir servicio</button></div>`).join(''):'<div class="card">No tienes servicios asignados.</div>'}`}
function work(v){const c=S.wk||{},inn=v.ci.find(x=>x.t=='in'),out=v.estado=='En curso';
return `<button class="btn s g" onclick="S.sel=null;S.wk=null;R_()">‹ Volver</button><h2>${v.ab}</h2><p class="mu">${v.dir}, ${v.prov}<br>📝 ${v.notas||'Sin notas'}</p>
${!inn?`<div class="card"><h3>1. Check-in</h3><p class="mu">Se exige GPS y foto de llegada con marca de agua.</p><label>📸 Foto de llegada</label><input type="file" accept="image/*" capture="environment" id="ph" onchange="S.wk={...S.wk,f:this.files[0]};S.wk.ok=1;R_()"><button class="btn y" ${c.ok?'':'disabled'} onclick="marcar(${v.id},'in')">📍 CHECK-IN ahora</button>${c.ok?'':'<p class="mu">Toma la foto para activar el botón. (En demo puedes continuar sin cámara)</p><button class="btn s g" onclick="S.wk={ok:1};R_()">Usar foto demo</button>'}</div>`
:`<div class="card"><span class="chip Asignado">✔ Check-in ${tm(inn.ts)}</span><img src="${inn.foto}" style="width:100%;border-radius:12px;margin-top:8px"></div>
<div class="card"><h3>2. Mini-reporte y check-out</h3><label>¿Cómo comió?</label><select id="rc"><option>Comió bien</option><option>Comió poco</option><option>No quiso comer</option></select>
<label>¿Tomó su pastilla?</label><select id="rp"><option value="1">Sí</option><option value="0">No / no aplica</option></select><label>Ánimo (1–5): <span id="av">5</span></label><input type="range" min="1" max="5" value="5" id="ra" oninput="$('#av').textContent=this.value">
<label>Nota</label><textarea id="rn" rows="2" placeholder="Ej: Rezamos y vimos la novela"></textarea>
${v.add.includes('video')?`<label>🎥 Video-Abrazo (30s)</label><input type="file" accept="video/*" capture="user" onchange="S.wk={...S.wk,vid:URL.createObjectURL(this.files[0])}">`:''}
<label>📸 Foto final</label><input type="file" accept="image/*" capture="environment" onchange="S.wk={...S.wk,f:this.files[0],ok:1}"><button class="btn y" onclick="marcar(${v.id},'out')">✅ CHECK-OUT y enviar reporte</button></div>`}`}
async function marcar(id,t){const v=V.find(x=>x.id==id),q=t=='out'?{comio:$('#rc').value,pastilla:$('#rp').value=='1',animo:+$('#ra').value,nota:$('#rn').value}:0;toast('Obteniendo GPS…');const g=await gps(v),ts=Date.now();const f=await mark(S.wk&&S.wk.f,[(t=='in'?'Check-in ':'Check-out ')+tm(ts)+' · '+ACO[0].n,dt(ts)+' · '+g.lat.toFixed(5)+', '+g.lng.toFixed(5)]);
v.ci.push({t,ts,lat:g.lat,lng:g.lng,foto:f,sim:g.sim});
if(t=='in'){v.estado='En curso';S.wk=null;toast('✅ Check-in guardado. WhatsApp enviado a '+v.fam+' (demo)')}
else{v.rep={...q,video:S.wk&&S.wk.vid};v.estado='Completado';S.wk=null;S.sel=null;toast('✅ Reporte enviado a la diáspora por WhatsApp (demo)')}R_()}
function sos(){S.sos=Date.now();S.sheet=`<h2 style="color:#d62839">🚨 Alerta SOS enviada</h2><p>La Mesa Operacional recibió tu ubicación y te llamará ahora. Mantén la calma.</p><button class="btn" onclick="S.sheet='';R_()">Entendido</button>`;R_()}
function admin(){const pts=V.flatMap(v=>[{lat:v.lat,lng:v.lng,c:v.estado=='En curso'?'#FFC20E':v.estado=='Completado'?'#999':'#0A4DA1',l:v.ab,big:v.estado=='En curso'}]);const mg=V.reduce((s,v)=>s+(v.estado!='Pendiente'?tot2(v)*.32:0),0);
return `${S.sos?`<div class="card" style="background:#d62839;color:#fff"><b>🚨 SOS de María Altagracia · ${tm(S.sos)}</b><br>Llamar de inmediato.<button class="btn s y" onclick="S.sos=0;R_()">Atendida</button></div>`:''}<h2>Mesa operacional</h2>${map(pts)}
<div class="row" style="margin:10px 0"><div class="card" style="flex:1;margin:0"><span class="mu">Servicios</span><h3>${V.length}</h3></div><div class="card" style="flex:1;margin:0"><span class="mu">Margen 32% (solo admin)</span><h3>${R(Math.round(mg))}</h3></div></div>
${V.map(v=>`<div class="card"><div class="row"><h3>${v.ab}</h3><span class="chip ${st(v)}">${v.estado}</span></div><p class="mu">${T[v.tipo].n} · ${dt(v.fecha)} ${v.hora} · ${v.prov}<br>Total ${R(tot2(v))} · margen ${R(Math.round(tot2(v)*.32))}</p>
${v.estado=='Pagado'?`<select onchange="asig(${v.id},this.value)"><option value="">Asignar del pool (${ACO.filter(a=>a.v).length} verificadas)…</option>${ACO.filter(a=>a.v).map(a=>`<option value="${a.id}">${a.n} · ⭐${a.r}</option>`).join('')}</select>`:v.aco?`<p>💙 ${ACO[v.aco-1].n}</p>`:''}
<a class="btn s y" target="_blank" rel="noopener" href="https://wa.me/18095550101?text=${encodeURIComponent('JUNTOS: servicio de '+v.ab+' a las '+v.hora)}">WhatsApp</a></div>`).join('')}`}
function asig(id,a){if(!a)return;const v=V.find(x=>x.id==id);v.aco=+a;v.estado='Asignado';R_();toast('Asignada. WhatsApp enviado a '+ACO[a-1].n.split(' ')[0]+' y a la familia (demo)')}
init();R_();
</script></body></html>
